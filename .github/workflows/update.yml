name: Update market data

# 四個時段（台北時間）：
#   08:10  強勢股新聞（開盤前，補上前一晚到早上的新聞；週一～五）
#   09:00  DRAM、美債、黃金、BTC、行事曆、F1、SpaceX，並補抓前一天盤後還缺的資料
#   17:30  收盤行情、三大法人、本益比（證交所、櫃買中心約傍晚公布），之後跑強勢股新聞
#   21:40  融資融券、重大訊息、月營收、財報
# 強勢股新聞會呼叫 Claude（Secrets 的 ANTHROPIC_API_KEY）；沒設定就只用關鍵字規則。
# 全市場日資料每次都回頭檢查幾天，缺什麼補什麼；公布時間晚了也會在下一次補上。
# GitHub 的排程常延遲十幾分鐘到半小時，不影響盤後資料。
on:
  schedule:
    - cron: "10 0 * * 1-5"
    - cron: "0 1 * * *"
    - cron: "30 9 * * 1-5"
    - cron: "40 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-market
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        # 直接裝 requirements.txt，不要維護第二份清單 ——
        # 之前寫死套件列表，加了 opencc 卻忘了同步，排程就默默把
        # F1 車手名字寫成簡體（沒有 opencc 時 _to_tw 原樣回傳）。
        run: pip install -r requirements.txt

      - name: Fetch data
        # 新聞不在這裡跑，它有自己的十分鐘排程（news.yml）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 盤前／盤後摘要會推播
          BARK_KEY: ${{ secrets.BARK_KEY }}
          ALERTS_ENABLED: ${{ vars.ALERTS_ENABLED }}
        run: |
          case "${{ github.event.schedule }}" in
            "10 0 * * 1-5")
              python update_data.py xmarket bonds events stocknews digest hotnews ;;
            "0 1 * * *")
              python update_data.py dram bonds gold btc calendar f1 f1standings spacex market chips xmarket options stock events backfill macro hotnews ;;
            "30 9 * * 1-5")
              python update_data.py market chips xmarket options stock events signallog stocknews digest hotnews ;;
            "")
              # 手動執行：全部跑一次
              python update_data.py dram bonds gold btc calendar f1 f1standings spacex market chips xmarket options stock events signallog backfill stocknews macro hotnews ;;
            *)
              python update_data.py market chips xmarket stock events signallog backfill calendar macro hotnews ;;
          esac

      - name: Alerts
        # 自選股推播。BARK_KEY 沒設定就只記在執行紀錄；ALERTS_ENABLED 設成 false 就完全不推
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          ALERTS_ENABLED: ${{ vars.ALERTS_ENABLED }}
        run: python alerts.py

      - name: Data quality
        # 資料品質檢查：結果寫 data/quality.json；有錯誤等級的問題就推播
        if: always()
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALERTS_ENABLED: ${{ vars.ALERTS_ENABLED }}
        run: python quality.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data && [ -z "$(git ls-files --others --exclude-standard data)" ]; then
            echo "無變更，略過 commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: 更新行情資料 ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          # 新聞排程可能同時在推，兩邊改的檔案不同，重新 rebase 就能推上去
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort || true
            sleep 10
          done
          echo "::error::推送失敗三次"
          exit 1

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  notify-failure:
    # 任何一步失敗都推播（BARK_KEY 沒設定就只留在執行紀錄）
    needs: [update, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python alerts.py --failure "Update market data"
