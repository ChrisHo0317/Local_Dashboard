name: Update market data

on:
  schedule:
    # 每日 UTC 01:00 ≈ 台灣時間 09:00
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        # 直接裝 requirements.txt，不要維護第二份清單 ——
        # 之前寫死套件列表，加了 opencc 卻忘了同步，排程就默默把
        # F1 車手名字寫成簡體（沒有 opencc 時 _to_tw 原樣回傳）。
        run: pip install -r requirements.txt

      - name: Fetch latest prices and rebuild page
        # 新聞不在這裡跑，它有自己的十分鐘排程（news.yml）
        run: python update_data.py dram bonds gold calendar f1 f1standings spacex stock

      - name: Commit if changed
        run: |
          if git diff --quiet -- data docs/index.html docs/news docs/stock; then
            echo "無變更，略過 commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/index.html docs/news docs/stock
          git commit -m "chore: 更新行情資料 ($(date -u +%Y-%m-%d))"
          git push
