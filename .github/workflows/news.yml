name: Update news

# 新聞跟行情不同，一天更新一次等於永遠在看昨天的頭條，所以獨立一個排程。
# 只抓清單上新出現的文章的內文（看過的沿用 CSV），每次通常只有幾篇要抓。
#
# 注意：GitHub 的排程很不準，這種高頻的 cron 實測一天只跑五次左右。
# 所以由盤中服務的 Cloudflare Worker 每 10 分鐘準時呼叫 workflow_dispatch（intraday/dispatch.js），
# 下面的 schedule 留著當備援；兩邊都跑也沒關係，沒有新新聞就不會 commit。
on:
  schedule:
    # 刻意避開整點與 10 的倍數：GitHub 的排程佇列在那些時刻最擠，
    # 錯開幾分鐘通常能少等一點。
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 上一輪還沒跑完就不要再開一輪
concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 排隊等過前一輪的話，要拿它推上去之後的最新資料（熱門新聞的時段紀錄），不是觸發當下的舊 commit
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news
        run: python update_data.py news

      - name: Hot news analysis
        # 08:00、14:00、21:00（台北）三個時段各做一次，其他時候直接跳過；重要的新事件會推播
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          ALERTS_ENABLED: ${{ vars.ALERTS_ENABLED }}
        run: python update_data.py hotnews

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/news_articles.csv data/hot_news.json \
             && [ -z "$(git ls-files --others --exclude-standard data/hot_news.json)" ]; then
            echo "無新新聞，略過 commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news_articles.csv
          [ -f data/hot_news.json ] && git add data/hot_news.json
          git commit -m "chore: 更新新聞 ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          # 行情排程可能同時在推。衝突就放棄這一輪 ——
          # 十分鐘後會再跑一次，硬解衝突反而可能推出壞掉的資料。
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "與遠端衝突，本輪放棄"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: news
    if: needs.news.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  notify-failure:
    needs: [news]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # 每 10 分鐘一輪：上一輪也失敗就不再推，同一段故障只推第一次
      - id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list -R "$GITHUB_REPOSITORY" --workflow news.yml --status completed --limit 5 \
                   --json databaseId,conclusion \
                   --jq '[.[] | select(.databaseId != ${{ github.run_id }})][0].conclusion // ""' || echo "")
          echo "conclusion=$prev" >> "$GITHUB_OUTPUT"
      - if: steps.prev.outputs.conclusion != 'failure'
        uses: actions/checkout@v4
      - if: steps.prev.outputs.conclusion != 'failure'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - if: steps.prev.outputs.conclusion != 'failure'
        run: pip install -r requirements.txt
      - if: steps.prev.outputs.conclusion != 'failure'
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python alerts.py --failure "Update news"
